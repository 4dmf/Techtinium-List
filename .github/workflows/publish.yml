name: Publish

on:
  push:
    branches:
      - "master"
  schedule:
    - cron: '0 4 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        lfs: true

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install & Build
      run: |
        mkdir public
        cd ./modules/cli
        npm ci
        npm run build
      env:
        CI: true

    - name: Generate AllowList
      run: |
        node ./modules/cli/dist/main.js generate \
        --name Techtinium-List.Allow.txt \
        --badge badge-allow.json \
        --external ./allowlist/external \
        --custom ./allowlist/custom \
        --concatExternal ./allowlist/concat \
        --convertToAllow true \
        --output ./public

    - name: Generate BlockList
      run: |
        node ./modules/cli/dist/main.js generate \
        --name Techtinium-List.Block.txt \
        --badge badge-block.json \
        --external ./blocklist/external \
        --custom ./blocklist/custom \
        --concatExternal ./blocklist/concat \
        --output ./public

    - name: Split Public/Debug
      run: |
        split -b 50m -d -a 3 "public/debug.Techtinium-List.Allow.txt" "public/Debug-Techtinium-List.Allow.txt.part-"
        split -b 50m -d -a 3 "public/debug.Techtinium-List.Block.txt" "public/Debug-Techtinium-List.Block.txt.part-"
        rm public/debug.Techtinium-List.Allow.txt
        rm public/debug.Techtinium-List.Block.txt
      env:
        CI: true

    - name: Build Pages Index
      run: |
        {
          echo '<!doctype html>'
          echo '<html lang="en">'
          echo '<head>'
          echo '  <meta charset="utf-8">'
          echo '  <meta name="viewport" content="width=device-width, initial-scale=1">'
          echo '  <title>Techtinium List</title>'
          echo '  <style>'
          echo '    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }'
          echo '    h1 { margin-bottom: 0.5rem; }'
          echo '    ul { padding-left: 1.2rem; }'
          echo '    li { margin: 0.25rem 0; }'
          echo '  </style>'
          echo '</head>'
          echo '<body>'
          echo '  <h1>Techtinium List</h1>'
          echo '  <p>Generated files:</p>'
          echo '  <ul>'
          find public -maxdepth 1 -type f -not -name 'index.html' -printf '%f\n' | sort | while IFS= read -r file; do
            printf '    <li><a href="%s">%s</a></li>\n' "$file" "$file"
          done
          echo '  </ul>'
          echo '</body>'
          echo '</html>'
        } > public/index.html

    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        folder: public
        clean: true
        single-commit: true
        force: true
