name: Lint

on:
  pull_request:
    branches: ["*"]
  push:
    branches:
      - master

jobs:
  lint:
    name: Lint & format check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm ci

      - name: Install CLI dependencies
        run: npm ci
        working-directory: modules/cli

      - name: Lint (check only)
        run: npm run lint
        env:
          CI: true
